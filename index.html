<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video</title>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://s.ytimg.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="dns-prefetch" href="https://googlevideo.com">
<script async src="https://www.youtube.com/iframe_api"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  .video-fullscreen-1 { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #000; }
  .video-fullscreen-1 .frame {
    width: calc(100vh * 16 / 9);
    height: calc(100vw * 16 / 9);
    min-width: 100%;
    min-height: 100%;
    overflow: hidden;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate3d(-50%, -50%, 0);
  }
  .video-fullscreen-1 iframe { width: 100%; height: 100%; display: block; border: 0; pointer-events: none; }

  /* 페이드 없이 즉시 걷히는 검은 막 (유튜브 중앙 버튼 가리기용) */
  .curtain { position: absolute; inset: 0; z-index: 2; background: #000; pointer-events: none; }
  .curtain.hide { display: none; }

  .shield { position: absolute; inset: 0; z-index: 3; }
</style>
</head>
<body>
  <section class="video-fullscreen-1">
    <div class="frame" id="frame"></div>
    <div class="curtain" id="curtain"></div>
    <div class="shield"></div>
  </section>

<script>
  const VIDEO_ID = 'CNMLglNXBcc';
  const HIDE_DELAY = 700;   // 재생 시작 후 막이 사라지기까지 (ms). 버튼이 비치면 늘리고, 0이면 즉시
  const curtain = document.getElementById('curtain');
  let player, timer;

  function showCurtain() { clearTimeout(timer); curtain.classList.remove('hide'); }
  function hideCurtain() {
    clearTimeout(timer);
    if (HIDE_DELAY > 0) timer = setTimeout(() => curtain.classList.add('hide'), HIDE_DELAY);
    else curtain.classList.add('hide');
  }

  // iframe을 API 로딩을 기다리지 않고 바로 생성
  (function () {
    const p = new URLSearchParams({
      autoplay: 1, mute: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1,
      iv_load_policy: 3, disablekb: 1, fs: 0, cc_load_policy: 0, enablejsapi: 1
    });
    if (location.protocol.startsWith('http')) p.set('origin', location.origin);
    const f = document.createElement('iframe');
    f.id = 'yt';
    f.allow = 'autoplay; encrypted-media';
    f.src = `https://www.youtube.com/embed/${VIDEO_ID}?${p}`;
    document.getElementById('frame').appendChild(f);
  })();

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('yt', {
      events: {
        onReady: e => { e.target.mute(); e.target.playVideo(); },
        onStateChange: e => {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING) hideCurtain();
          else if (e.data === S.PAUSED || e.data === S.CUED || e.data === S.UNSTARTED) { showCurtain(); e.target.playVideo(); }
          else if (e.data === S.ENDED) { showCurtain(); e.target.seekTo(0); e.target.playVideo(); }
        }
      }
    });

    // 반복: 끝나기 직전에 처음으로 (종료 화면이 안 뜨게)
    setInterval(() => {
      if (!player || !player.getDuration) return;
      const d = player.getDuration();
      if (d > 0 && player.getCurrentTime() >= d - 0.5) player.seekTo(0, true);
    }, 250);
  };

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && player && player.playVideo) player.playVideo();
  });
  // 자동재생이 막힌 환경에서도 영영 까만 화면이 되지 않도록
  setTimeout(() => { if (!player) curtain.classList.add('hide'); }, 10000);
</script>
</body>
</html>
